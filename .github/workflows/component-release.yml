name: Publish net component

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Repository gates before packaging
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve Rust channel
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy
      - name: Verify tag version and descriptor identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          descriptor_version="$(awk -F'"' '$1 ~ /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' bitty-component.toml)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$descriptor_version"
          test "$version" = "$cargo_version"
          grep -Fx 'name = "net"' bitty-component.toml >/dev/null
          grep -Fx 'executable = "bitty-net"' bitty-component.toml >/dev/null
          grep -Fx 'protocol = [1, 1]' bitty-component.toml >/dev/null
      - name: Run repository gates
        run: just check

  targets:
    name: Resolve the supported release matrix
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the release matrix and supported-target gate
        run: scripts/component-release.sh check
      - name: Emit GitHub Actions matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(scripts/component-release.sh targets --format json)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Package net ${{ matrix.target }}
    needs: targets
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        shell: bash
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy
      - name: Native compile and test evidence
        shell: bash
        run: |
          cargo check --workspace --all-targets --locked
          cargo test -p bitty-net --locked
      - name: Build and pack the target tarball
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/bitty-net"
          case "$TARGET" in
          *-windows-*) binary="$binary.exe" ;;
          esac
          cargo build --release --locked -p bitty-net --target "$TARGET"
          scripts/package-component.sh \
            --version "${TAG#v}" \
            --target "$TARGET" \
            --binary "$binary" \
            --output "dist/$TARGET.tar.gz"
      - name: Protocol smoke against the packed executable
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/net-component"
          if command -v cygpath >/dev/null 2>&1; then
            stage="$(cygpath -u "$RUNNER_TEMP")/net-component"
          fi
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -xzf "dist/$TARGET.tar.gz" -C "$stage"
          binary="$stage/bitty-net"
          case "$TARGET" in
          *-windows-*) binary="$binary.exe" ;;
          esac
          chmod 755 "$binary" 2>/dev/null || true
          smoke_binary="$binary"
          if command -v cygpath >/dev/null 2>&1; then
            smoke_binary="$(cygpath -w "$binary")"
          fi
          scripts/component-release.sh smoke --binary "$smoke_binary" --timeout 30
      - name: Emit the catalog row for this target
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/component-release.sh catalog --dist dist --output "catalog/$TARGET.catalog.v1"
          test "$(grep -c '^extension ' "catalog/$TARGET.catalog.v1")" = "1"
          grep -F " $TARGET " "catalog/$TARGET.catalog.v1"
      - name: Upload the verified target package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-component-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  aggregate:
    name: Aggregate manifest and catalog rows
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: net-component-*
          merge-multiple: true
          path: dist
      - name: Regenerate the aggregate SHA256SUMS
        run: scripts/component-release.sh manifest --dist dist
      - name: Emit the per-target digest record
        run: scripts/component-release.sh record --dist dist --output release/component-digests.toml
      - name: Verify the full supported matrix, descriptor chain, and digest record
        run: |
          scripts/component-release.sh verify \
            --dist dist \
            --record release/component-digests.toml
      - name: Emit the catalog.v1 row fragment
        run: scripts/component-release.sh catalog --dist dist --output catalog/catalog.v1
      - name: Show the verified catalog fragment and digest record
        run: |
          cat catalog/catalog.v1
          cat release/component-digests.toml
      - name: Upload the verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-component-package
          path: |
            dist/
            catalog/
            release/
          if-no-files-found: error

  publish:
    name: Publish net component to R2
    needs: aggregate
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'bitty' }}
      R2_PREFIX: extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: net-component-package
          path: package
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install Wrangler
        run: bun add --global wrangler@4.135.0
      - name: Publish the immutable payload directory
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ github.ref_name }}
        # Payloads only (tarballs, sidecars, SHA256SUMS). The catalog fragment
        # is produced and verified by the aggregate job but is NOT uploaded
        # here: extensions/catalog.v1 is one shared object across components,
        # so a single-component fragment would clobber other rows. The future
        # catalog merge job owns that key.
        run: scripts/publish-component.sh package/dist "${GITHUB_REF_NAME#v}"
