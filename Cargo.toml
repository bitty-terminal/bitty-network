[workspace]
resolver = "2"
members = ["crates/bitty-network-api", "crates/bitty-network-core", "crates/bitty-network-dns", "crates/bitty-network-tls", "crates/bitty-network"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-network"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

