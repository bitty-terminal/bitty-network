# component-targets.toml — supported release targets for the `net` component
# (issue bitty-terminal/bitty#2491, milestone 0.0.27).
#
# Single source of truth for `scripts/component-release.sh`: the CI and
# release workflows consume `targets --format json`, the pack/verify steps
# consume the same rows, and only a `supported = true` row can ever produce a
# tarball, `SHA256SUMS` entry, or `extensions/catalog.v1` row.
#
# `triple` must be one of the host triples the Core installer requests
# (`host_target_triple` in `bitty/crates/bitty-terminal/src/component_seed.rs`).
# `os` and `arch` must match that triple; `runner` is the GitHub-hosted
# runner label that proves the target natively (compile, test, run, pack).
#
# The gate `scripts/component-release.sh check` fails when no target is
# supported, when a supported target lacks a runner, when an unsupported
# target lacks a reason, or when a triple is duplicated or unknown.
#
# This matrix deliberately carries no digests: it is the input, not the
# release output. `scripts/component-release.sh record` writes the per-target
# tarball/executable digests to release/component-digests.toml after the
# artifacts are verified, and `verify --record` requires an exact match.

schema = 1

# Linux glibc x86_64: native ubuntu-24.04 build, test, run, pack.
[[target]]
triple = "x86_64-unknown-linux-gnu"
os = "linux"
arch = "x86_64"
runner = "ubuntu-24.04"
supported = true

# Linux glibc aarch64: native arm64 runner (public repository). The HTTP
# backend's aws-lc-sys C dependency builds with the runner's native toolchain.
[[target]]
triple = "aarch64-unknown-linux-gnu"
os = "linux"
arch = "aarch64"
runner = "ubuntu-24.04-arm"
supported = true

# macOS arm64: native Apple-silicon runner.
[[target]]
triple = "aarch64-apple-darwin"
os = "macos"
arch = "aarch64"
runner = "macos-15"
supported = true

# macOS x86_64: native Intel runner.
[[target]]
triple = "x86_64-apple-darwin"
os = "macos"
arch = "x86_64"
runner = "macos-15-intel"
supported = true

# Windows x86_64 (MSVC): native windows-2025 runner, `.exe` archive member.
[[target]]
triple = "x86_64-pc-windows-msvc"
os = "windows"
arch = "x86_64"
runner = "windows-2025"
supported = true

# Documented exclusions: the installer can request these triples on those
# hosts, but this repository publishes no bytes for them. They must stay out
# of the manifest and the catalog instead of shipping unverified artifacts.

# Alpine/musl x86_64 hosts request the musl triple. The shipped graph is not
# pure Rust: `bitty-network-tls` enables rustls' `aws-lc-rs` provider, so
# `aws-lc-sys` compiles C/assembly through cmake, and `rustls-platform-verifier`
# reads the platform trust store (openssl-probe) at runtime. A musl artifact
# therefore needs a static Alpine toolchain build plus a native musl run that
# proves both the crypto assembly and the trust-store lookup; today's
# `x86_64-unknown-linux-gnu` artifact is the only one with that proof.
[[target]]
triple = "x86_64-unknown-linux-musl"
os = "linux"
arch = "x86_64"
supported = false
reason = "not a pure-Rust graph (aws-lc-sys C/asm plus platform trust-store lookup); a static musl artifact needs its own Alpine toolchain build and native run before any bytes are published"

# Windows arm64 hosts request this triple. `aws-lc-sys` needs a clang/LLVM plus
# cmake assembler path for its Windows ARM64 crypto code, and the MSVC arm64
# CRT and `rustls-platform-verifier` Windows arm64 backend are separate ABI
# targets. This repository has no native arm64 Windows runner (only the
# x86_64 `windows-2025` leg is proven), so no arm64 bytes are published.
[[target]]
triple = "aarch64-pc-windows-msvc"
os = "windows"
arch = "aarch64"
supported = false
reason = "no native arm64 Windows runner in this repository; aws-lc-sys needs a clang/cmake ARM64 assembler path and the MSVC arm64 ABI is unproven here"
