[package]
name = "bitty-network-tls"
description = "Bitty TLS trust and client-identity provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-network"
keywords = ["tls", "bitty", "network"]
categories = ["network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
bitty-network-api = { path = "../bitty-network-api", version = "0.1.0" }
# TLS provider dependencies: rustls client configuration, platform verifier for
# native roots, PKI types for certificates/keys/PEM, IDNA for canonical-host
# normalization, and zeroize for key buffers. Exact pins match bitty-network.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }
idna = { version = "=1.1.0" }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
# Test-only runtime CA and key generation. Dev-only, so it never enters the
# shipped graph: the acceptance test must generate its CA and private key at
# runtime and keep them outside the repository, so no certificate or key
# fixture is ever committed. `default-features = false` with `aws_lc_rs`
# avoids pulling a second crypto provider into the test build.
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
# `OffsetDateTime` is the type of a generated certificate's validity window.
# Already in the graph through rcgen; a dev-dependency so the test-only
# certificates can name an explicit, fixed window instead of "around now".
# Pinned to 0.3.41 (last version compatible with MSRV 1.85). RUSTSEC-2026-0009
# affects this version but is in the unreachable RFC 2822 parser, and the fix
# needs rustc 1.88. Documented in deny.toml as a dev-dependency exception.
time = { version = "=0.3.41", default-features = false, features = ["std"] }
