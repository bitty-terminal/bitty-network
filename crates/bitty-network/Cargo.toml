[package]
name = "bitty-network"
description = "Bitty network implementation with capability-first offline, HTTP, and WebSocket transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-network"
keywords = ["network", "bitty"]
categories = ["network-programming"]
publish = false

[lints]
workspace = true

[dependencies]
bitty-network-api = { path = "../bitty-network-api", version = "0.1.0" }
bitty-network-core = { path = "../bitty-network-core", version = "0.1.0" }
bitty-network-dns = { path = "../bitty-network-dns", version = "0.1.0", optional = true }
bitty-network-tls = { path = "../bitty-network-tls", version = "0.1.0", optional = true }
# First real transport (CTX-0003, issue #4): reqwest blocking client behind
# the default-off `http` feature. Exact pin in exactly one place (here);
# transitive pins live in the workspace Cargo.lock; license/source approval
# lives in deny.toml. Default features are OFF on purpose: no charset, no
# HTTP/2, no OS system-proxy magic — TLS is rustls (pure Rust, platform
# verifier for native roots). Standard proxy variables and NO_PROXY are read
# explicitly in `src/http.rs`; reqwest system-proxy discovery is disabled so
# behavior stays observable, credential-checked, and tested.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
# WebSocket transport slice (CTX-0004, issue #7): sync tungstenite client
# behind the default-off `websocket` feature. Exact pin in exactly one place
# (here); transitive pins live in the workspace Cargo.lock; license/source
# approval lives in deny.toml. Default features are OFF on purpose: the
# `handshake` feature is enabled explicitly and TLS is rustls with native
# roots (pure Rust, no OpenSSL system dependency — same trust approach as
# the `http` backend: the platform root store, no custom CA). The `url`
# feature stays off: URL parsing is a few lines of best-effort splitting in
# `src/websocket.rs`, same as `Request::host`.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"], optional = true }

[dev-dependencies]
# Test-only runtime CA and key generation (CTX-0021, issue #21). Dev-only, so
# it never enters the shipped graph: the acceptance test must generate its CA
# and private key at runtime and keep them outside the repository, so no
# certificate or key fixture is ever committed. `default-features = false`
# with `aws_lc_rs` avoids pulling a second crypto provider into the test build.
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
# `OffsetDateTime` is the type of a generated certificate's validity window.
# Already in the graph through rcgen; a dev-dependency so the test-only
# certificates can name an explicit, fixed window instead of "around now".
# Pinned to 0.3.41 (last version compatible with MSRV 1.85). RUSTSEC-2026-0009
# affects this version but is in the unreachable RFC 2822 parser, and the fix
# needs rustc 1.88. Documented in deny.toml as a dev-dependency exception.
time = { version = "=0.3.41", default-features = false, features = ["std"] }

[features]
default = []
client = []
# Accepted fail-closed no-op (CTX-0015, issue #26): client-only by
# construction, no listen path. Never add code behind this gate without a
# listen capability verb plus UE and security-corpus review.
server = []
http = [
  "dep:bitty-network-dns",
  "dep:bitty-network-tls",
  "dep:reqwest",
]
# The WebSocket handshake reuses the `http` backend (capability ownership,
# proxy decision, service type, TLS provider), so the feature implies `http`.
websocket = ["dep:tungstenite", "http"]
# Direction marker only, not a contract (CTX-0015, issue #27): enables no
# transport. A real QUIC backend needs deny.toml approval, an MSRV-1.85
# pick, and capability-first enforcement before it lands here.
quic = []
# Environment-proxy inheritance opt-in (CTX-0015, issue #29): with this
# gate backends may inherit HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, and NO_PROXY
# (including lowercase spellings); without it egress is direct-only unless
# the caller passes an explicit proxy (always on).
proxy = []
# Accepted fail-closed no-op (CTX-0015, issue #28): oauth credential flow
# is deferred to a joint design with the bitty-ai owners plus a
# security-corpus review. No token code behind this gate until sign-off.
oauth = []
